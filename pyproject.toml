[project]
name = "healplus-intake-image-api"
version = "0.1.0"
description = "API de intake de imagens para análise"
readme = "README.md"
authors = [
    { name = "wolley silva", email = "wolleyws@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.1",
]

[project.scripts]
healplus-intake-image-api = "healplus_intake_image_api:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
