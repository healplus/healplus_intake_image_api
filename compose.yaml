services:
  postgres:
    image: postgres:16-alpine
    container_name: healplus-postgres
    restart: unless-stopped
    command: -c 'max_connections=20'

    environment:
      POSTGRES_DB: healplus
      POSTGRES_USER: healplus
      POSTGRES_PASSWORD: healplus_dev

    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healplus -d healplus"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-scripts:/docker-entrypoint-initdb.d
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - default-network

volumes:
  postgres_data:

networks:
  default-network:
    driver: bridge